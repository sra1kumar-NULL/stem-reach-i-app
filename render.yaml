services:
  - type: web
    name: stemreach-api
    runtime: node
    repo: https://github.com/sra1kumar-NULL/stem-reach-i-app
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/readyz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Optional: number of proxies appending to X-Forwarded-For (Render = 1).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
